name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate configuration and locale bundles
        run: |
          node -e "console.log('Validating localization files...')"
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
          echo "All DSH Desktop localization files verified successfully!"
